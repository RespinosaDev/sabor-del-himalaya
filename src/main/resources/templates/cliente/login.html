<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera}"></header>
<main>
    <h1>Iniciar sesión</h1>
    <div th:replace="~{fragmentos :: avisos}"></div>
    <form th:action="@{/login}" method="post" class="formulario">
        <label>Login <input type="text" name="login" th:value="${login}" required></label>
        <label>Contraseña <input type="password" name="contrasena" required></label>
        <div class="botones"><button type="submit" class="boton">Entrar</button></div>
    </form>
    <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
</body>
</html>
