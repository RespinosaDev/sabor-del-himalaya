<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Registro')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera}"></header>
<main>
    <h1>Crear una cuenta</h1>
    <div th:replace="~{fragmentos :: avisos}"></div>
    <form th:action="@{/registro}" th:object="${datos}" method="post" class="formulario">
        <label>Nombre <input type="text" th:field="*{nombre}" maxlength="80" required></label>
        <label>Dirección de entrega <input type="text" th:field="*{direccion}" maxlength="200" required></label>
        <label>Correo electrónico <input type="email" th:field="*{email}" maxlength="120" required></label>
        <label>Login <input type="text" th:field="*{login}" maxlength="40" required></label>
        <label>Contraseña <input type="password" th:field="*{contrasena}" minlength="6" required></label>
        <label>Repetir contraseña <input type="password" th:field="*{confirmacion}" minlength="6" required></label>
        <div class="botones"><button type="submit" class="boton">Registrarme</button></div>
    </form>
    <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</main>
</body>
</html>
