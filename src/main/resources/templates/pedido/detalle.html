<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Pedido')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera}"></header>
<main>
    <h1 th:text="'Pedido ' + ${pedido.id}">Pedido 1</h1>
    <div th:replace="~{fragmentos :: avisos}"></div>
    <p>Estado: <strong th:text="${pedido.estado.etiqueta}">Recibido</strong></p>
    <p>Realizado el <span th:text="${#temporals.format(pedido.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</span>
        · Entrega en <span th:text="${pedido.direccion}">Dirección</span></p>
    <table>
        <thead><tr><th>Concepto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
        <tbody>
        <tr th:each="l : ${pedido.lineas}">
            <td th:text="${l.concepto}">Momos</td>
            <td class="num" th:text="${l.cantidad}">1</td>
            <td class="num" th:text="${#numbers.formatDecimal(l.precioUnitario, 1, 2, 'COMMA')} + ' €'">6,50 €</td>
            <td class="num" th:text="${#numbers.formatDecimal(l.importe, 1, 2, 'COMMA')} + ' €'">6,50 €</td>
        </tr>
        </tbody>
        <tfoot>
        <tr><th colspan="3">Total</th>
            <th class="num" th:text="${#numbers.formatDecimal(pedido.importeTotal, 1, 2, 'COMMA')} + ' €'">0,00 €</th></tr>
        </tfoot>
    </table>
    <div class="botones" th:if="${admiteCambios}">
        <a class="boton secundario" th:href="@{/cliente/pedidos/{id}/modificar(id=${pedido.id})}">Modificar</a>
        <form th:action="@{/cliente/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="en-linea"
              onsubmit="return confirm('¿Cancelar este pedido?');">
            <button type="submit" class="enlace peligro">Cancelar pedido</button>
        </form>
    </div>
    <p class="estado" th:unless="${admiteCambios}">Este pedido ya no se puede modificar ni cancelar (pasaron diez minutos desde la confirmación o está cancelado).</p>
    <p><a th:href="@{/cliente/pedidos}">Volver a mis pedidos</a></p>
</main>
</body>
</html>
