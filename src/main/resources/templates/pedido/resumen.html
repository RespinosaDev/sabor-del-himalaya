<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Revisar pedido')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera}"></header>
<main>
    <h1>Revisa tu pedido</h1>
    <table>
        <thead><tr><th>Concepto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
        <tbody>
        <tr th:each="l : ${lineas}">
            <td th:text="${l.concepto}">Momos</td>
            <td class="num" th:text="${l.cantidad}">1</td>
            <td class="num" th:text="${#numbers.formatDecimal(l.precioUnitario, 1, 2, 'COMMA')} + ' €'">6,50 €</td>
            <td class="num" th:text="${#numbers.formatDecimal(l.importe, 1, 2, 'COMMA')} + ' €'">6,50 €</td>
        </tr>
        </tbody>
        <tfoot>
        <tr><th colspan="3">Total</th>
            <th class="num" th:text="${#numbers.formatDecimal(total, 1, 2, 'COMMA')} + ' €'">0,00 €</th></tr>
        </tfoot>
    </table>
    <form th:action="@{/cliente/pedidos/confirmar}" method="post" class="formulario">
        <input type="hidden" th:each="e : ${cantidades.productos}" th:name="'p_' + ${e.key}" th:value="${e.value}">
        <input type="hidden" name="menus" th:value="${cantidades.menus}">
        <div class="botones">
            <button type="submit" class="boton">Confirmar pedido</button>
            <a th:href="@{/cliente/pedidos/nuevo}">Cambiar el pedido</a>
        </div>
    </form>
</main>
</body>
</html>
