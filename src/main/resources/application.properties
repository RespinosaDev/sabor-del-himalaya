spring.application.name=sabor-del-himalaya
server.port=8080

# Base de datos H2 en fichero (carpeta ./data). Consola en /h2-console
spring.datasource.url=jdbc:h2:file:./data/sabor;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.thymeleaf.cache=false

# Datos de la aplicación
app.url-base=http://localhost:8080
app.correo.remitente=no-reply@sabordelhimalaya.es
# En desarrollo se muestra el enlace de activación en pantalla además de en el log
app.mostrar-enlace-activacion=true
app.datos-iniciales=true

